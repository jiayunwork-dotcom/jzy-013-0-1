services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buck
      POSTGRES_PASSWORD: buck
      POSTGRES_DB: buckdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buck -d buckdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: buck
      PG_PASSWORD: buck
      PG_DATABASE: buckdb
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
