services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-buck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buck_secret}
      POSTGRES_DB: ${DB_NAME:-buckcalc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-buck} -d ${DB_NAME:-buckcalc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DB_HOST_PORT:-5432}:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-buck}
      DB_PASSWORD: ${DB_PASSWORD:-buck_secret}
      DB_NAME: ${DB_NAME:-buckcalc}
      DB_SYNCHRONIZE: "true"
      VOLT_SECOND_TOL: "1e-9"
      BOUNDARY_TOL: "1e-12"
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
